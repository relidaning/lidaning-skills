services:
  chromadb:
    image: chromadb/chroma:0.6.3
    volumes:
      - ./data/chroma:/chroma/chroma
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag-mcp:
    build: ./rag-mcp
    network_mode: host
    volumes:
      - onnx-cache:/root/.cache/chroma
      # The same folder the obsidian-vault-mcp container (obsidian-local/server)
      # serves, under the same variable; read-only, the watcher only reads.
      - ${OBSIDIAN_VAULT_PATH:-/data/nextcloud_client/obsidian/lidaning}:/vault:ro
    environment:
      - CHROMA_HOST=localhost
      - CHROMA_PORT=8000
      - VAULT_DIR=/vault
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - TZ=Asia/Shanghai
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  onnx-cache:
