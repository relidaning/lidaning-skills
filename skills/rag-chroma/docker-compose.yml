services:
  chromadb:
    image: ${CHROMA_IMAGE:-chromadb/chroma:0.6.3}
    volumes:
      - ${CHROMA_DATA_DIR:-./data/chroma}:/chroma/chroma
    ports:
      - "${CHROMA_PUBLISH_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag-mcp:
    build:
      context: .
      dockerfile: rag-mcp/Dockerfile
      network: host  # the proxy listens on 127.0.0.1
      args:
        - http_proxy
        - https_proxy
        - PYTHON_IMAGE=${PYTHON_IMAGE:-python:3.12-slim}
        - E5_REPO=${E5_REPO:-Xenova/multilingual-e5-small}
        - E5_REVISION=${E5_REVISION:-main}
        - E5_MODEL_FILE=${E5_MODEL_FILE:-model_quantized.onnx}
    network_mode: host
    environment:
      # The vault is read through obsidian-local's obsidian-vault MCP server
      # (host network, so localhost is the host), not from disk.
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - TZ=${TZ:-Asia/Shanghai}
      # glibc: fewer malloc arenas and eager trimming, so memory freed after a
      # re-index goes back to the OS instead of staying resident
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      - MALLOC_TRIM_THRESHOLD_=${MALLOC_TRIM_THRESHOLD_:-0}
    # Optional environment-only runtime overrides (including credentials).
    env_file:
      - path: .env
        required: false
    volumes:
      - ${RAG_LOG_HOST_DIR:-./logs}:/skill/logs
      - ${RAG_CONFIG_PATH:-./config.toml}:/config.toml:ro
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
